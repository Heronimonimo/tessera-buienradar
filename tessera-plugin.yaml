# Buienradar: the rain of the next two hours for one place, as Buienradar's graph, and on larger tiles and the card
# its radar map as well, playing from half an hour ago to two hours ahead. Every field is explained in the plugins
# repository's docs/MANIFEST.md.
id: buienradar
version: 0.3.0
api: "0.14"
icon: weather-pouring
maintainer: Heronimonimo
license: MIT
stage: beta
topics: [weather]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 14

permissions:
  # The graph from Buienradar's forecast for one point, the radar frames from its picture host, the map under them (its
  # radar page's own background, the frames' very area) from its resource host.
  network: [graphdata.buienradar.nl, processing-cdn.buienradar.nl, cdn.buienradar.nl]
attributes: [cloud]
privacy: https://github.com/Heronimonimo/tessera-buienradar#privacy

tiles:
  # One tile of every size: the graph alone on a small tile, the map beside or above it from 3x2 or 2x3 on.
  - id: rain
    name: tile_name
    icon: weather-pouring
    sizes: { min: 1x1, max: 4x4 }
    # The graph's bars, its lines and labels, the words, the map's two places, the marker and the badge.
    memory: 4900
    # The map and the radar frame over it.
    pictures: 2
    data: rain
    example: tile_example
    # The place in steps of 0.1 (about 10 km), as exact words: the URL takes them as they are, and Buienradar answers
    # a coordinate with more decimals than it keeps with a redirect the app does not follow.
    options:
      - { id: latitude, kind: choice, default: "52.1", label: latitude, hint: latitude_hint,
          choices: [{ value: "49.5", label: lat_495 }, { value: "49.6", label: lat_496 }, { value: "49.7", label: lat_497 }, { value: "49.8", label: lat_498 }, { value: "49.9", label: lat_499 }, { value: "50.0", label: lat_500 }, { value: "50.1", label: lat_501 }, { value: "50.2", label: lat_502 }, { value: "50.3", label: lat_503 }, { value: "50.4", label: lat_504 }, { value: "50.5", label: lat_505 }, { value: "50.6", label: lat_506 }, { value: "50.7", label: lat_507 }, { value: "50.8", label: lat_508 }, { value: "50.9", label: lat_509 }, { value: "51.0", label: lat_510 }, { value: "51.1", label: lat_511 }, { value: "51.2", label: lat_512 }, { value: "51.3", label: lat_513 }, { value: "51.4", label: lat_514 }, { value: "51.5", label: lat_515 }, { value: "51.6", label: lat_516 }, { value: "51.7", label: lat_517 }, { value: "51.8", label: lat_518 }, { value: "51.9", label: lat_519 }, { value: "52.0", label: lat_520 }, { value: "52.1", label: lat_521 }, { value: "52.2", label: lat_522 }, { value: "52.3", label: lat_523 }, { value: "52.4", label: lat_524 }, { value: "52.5", label: lat_525 }, { value: "52.6", label: lat_526 }, { value: "52.7", label: lat_527 }, { value: "52.8", label: lat_528 }, { value: "52.9", label: lat_529 }, { value: "53.0", label: lat_530 }, { value: "53.1", label: lat_531 }, { value: "53.2", label: lat_532 }, { value: "53.3", label: lat_533 }, { value: "53.4", label: lat_534 }, { value: "53.5", label: lat_535 }, { value: "53.6", label: lat_536 }] }
      - { id: longitude, kind: choice, default: "5.2", label: longitude, hint: longitude_hint,
          choices: [{ value: "2.6", label: lon_26 }, { value: "2.7", label: lon_27 }, { value: "2.8", label: lon_28 }, { value: "2.9", label: lon_29 }, { value: "3.0", label: lon_30 }, { value: "3.1", label: lon_31 }, { value: "3.2", label: lon_32 }, { value: "3.3", label: lon_33 }, { value: "3.4", label: lon_34 }, { value: "3.5", label: lon_35 }, { value: "3.6", label: lon_36 }, { value: "3.7", label: lon_37 }, { value: "3.8", label: lon_38 }, { value: "3.9", label: lon_39 }, { value: "4.0", label: lon_40 }, { value: "4.1", label: lon_41 }, { value: "4.2", label: lon_42 }, { value: "4.3", label: lon_43 }, { value: "4.4", label: lon_44 }, { value: "4.5", label: lon_45 }, { value: "4.6", label: lon_46 }, { value: "4.7", label: lon_47 }, { value: "4.8", label: lon_48 }, { value: "4.9", label: lon_49 }, { value: "5.0", label: lon_50 }, { value: "5.1", label: lon_51 }, { value: "5.2", label: lon_52 }, { value: "5.3", label: lon_53 }, { value: "5.4", label: lon_54 }, { value: "5.5", label: lon_55 }, { value: "5.6", label: lon_56 }, { value: "5.7", label: lon_57 }, { value: "5.8", label: lon_58 }, { value: "5.9", label: lon_59 }, { value: "6.0", label: lon_60 }, { value: "6.1", label: lon_61 }, { value: "6.2", label: lon_62 }, { value: "6.3", label: lon_63 }, { value: "6.4", label: lon_64 }, { value: "6.5", label: lon_65 }, { value: "6.6", label: lon_66 }, { value: "6.7", label: lon_67 }, { value: "6.8", label: lon_68 }, { value: "6.9", label: lon_69 }, { value: "7.0", label: lon_70 }, { value: "7.1", label: lon_71 }, { value: "7.2", label: lon_72 }, { value: "7.3", label: lon_73 }] }
      - { id: map, kind: toggle, default: true, label: map, hint: map_hint }
      - { id: play, kind: choice, default: all, label: play, hint: play_hint,
          choices: [{ value: all, label: play_all }, { value: forecast, label: play_forecast },
                    { value: still, label: play_still }] }
      - { id: pace, kind: number, min: 1, max: 10, step: 1, unit: s, default: 2, label: pace, hint: pace_hint }

cards:
  # The map and the graph together over the whole glass; the graph is the timeline.
  - { id: radar, name: card_name, wide: true, pictures: 2 }

fetch:
  # Buienradar's rain for one point, every five minutes from about twenty minutes ago to two and a half hours ahead,
  # in millimetres an hour. The times are UTC.
  - id: rain
    url: https://graphdata.buienradar.nl/2.0/forecast/geo/RainHistoryForecast?lat={latitude}&lon={longitude}
    every: 5m
    map:
      items: "$.forecasts[*]"
      fields:
        at: { path: utcdatetime, as: epoch, tz: UTC }
        mm: { path: precipitation, as: number }
      limit: 40
