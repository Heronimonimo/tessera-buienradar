        - { utcdatetime: "{now+65m}", precipitation: 2.4 }
        - { utcdatetime: "{now+70m}", precipitation: 1.8 }
        - { utcdatetime: "{now+75m}", precipitation: 1.1 }
        - { utcdatetime: "{now+80m}", precipitation: 0.5 }
