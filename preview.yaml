# What tools/preview.py shows (the plugins repository's docs/PREVIEW.md). Buienradar's times are UTC, so the moments
# below are too. The radar frames and map tiles have addresses that follow the clock, so the bench draws stand-ins.
time_zone: UTC
tiles:
  - tile: rain
    name: Rain radar
    sizes: [3x2, 2x3, 4x4]
  - tile: rain
    name: Rain radar
    sizes: [1x1, 2x1, 2x2]
  - tile: rain
    name: Not set
    data: { wait: not_filled }
    sizes: [2x1]

answers:
  rain:
    forecasts:
        - { utcdatetime: "{now-20m}", precipitation: 0 }
        - { utcdatetime: "{now-15m}", precipitation: 0 }
