# What tools/preview.py shows (the plugins repository's docs/PREVIEW.md). Buienradar's times are UTC, so the moments
# below are too. The map and radar pictures are real ones of Buienradar in preview/; run tools/bench_pictures.py first.
time_zone: UTC
tiles:
  - tile: rain
    name: Rain radar
    sizes: [1x1, 2x1, 2x2]
  - tile: rain
    name: Rain radar
    sizes: [3x2, 2x3, 4x4]
  - tile: rain
    name: Square
    sizes: [3x3]
  - tile: rain
    name: Not set
    data: { wait: not_filled }
    sizes: [2x1]

answers:
  # As Buienradar answers: the measured past up to the newest radar frame (20 minutes ago here), a gap, then the
  # forecast. The plugin takes the newest radar frame from where the past ends.
  rain:
    forecasts:
        - { utcdatetime: "{now-30m}", precipitation: 0 }
        - { utcdatetime: "{now-25m}", precipitation: 0 }
        - { utcdatetime: "{now-20m}", precipitation: 0 }
        - { utcdatetime: "{now+5m}", precipitation: 0 }
        - { utcdatetime: "{now+10m}", precipitation: 0 }
        - { utcdatetime: "{now+15m}", precipitation: 0 }
        - { utcdatetime: "{now+20m}", precipitation: 0 }
        - { utcdatetime: "{now+25m}", precipitation: 0 }
        - { utcdatetime: "{now+30m}", precipitation: 0.3 }
        - { utcdatetime: "{now+35m}", precipitation: 0.5 }
        - { utcdatetime: "{now+40m}", precipitation: 0.8 }
        - { utcdatetime: "{now+45m}", precipitation: 1.3 }
